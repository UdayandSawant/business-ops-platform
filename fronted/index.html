<!DOCTYPE html>                    <!-- Tells the browser: this is HTML5 -->
<html>                             <!-- Starts the whole page -->
  <head>                           <!-- Hidden info about the page -->
    <title>My Platform</title>     <!-- Text on the browser tab -->
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS file -->
  </head>                          <!-- Ends the head -->
  <body>                           <!-- Everything visible goes here -->
    <h1>Welcome, Udayan</h1>        <!-- Biggest heading -->
    <p>i am learning java full stack with AI</p> <!-- A paragraph -->
    <ul>                           <!-- Starts a bullet list -->
      <li>Git</li>         <!-- First item -->
      <li>Branches</li>
      <li>Agile</li>          <!-- Second item -->
    </ul>                          <!-- Ends the list -->
    <button>Login</button>         <!-- A clickable button -->
  </body>                          <!-- Ends the visible part -->
  <script src="script.js"></script> <!-- Link to JS file -->
</html>                            <!-- Ends the page -->
